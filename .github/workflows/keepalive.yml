name: Keep Backend Warm

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          set -e
          URL="https://rescuenet-az60.onrender.com/api/healthz"
          echo "Pinging $URL"
          curl -fsS --max-time 20 "$URL"
